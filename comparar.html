<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Animais 3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icone/favicon.png">
<link rel="apple-touch-icon" href="img/icone/apple-touch-icon.png">
<title>Comparar bichos — Catálogo 3D de Animais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #4a2a12; --a: #ff9f68; --b: #5fb8ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; font-family: 'Baloo 2', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; color: var(--ink); background: linear-gradient(#fff6d6, #ffe0ad); background-attachment: fixed; min-height: 100%; }
  main { max-width: 760px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  .bar { display: flex; align-items: center; gap: 10px; }
  .bar a { flex: none; width: 48px; height: 48px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-decoration: none; font-size: 24px; color: var(--ink); box-shadow: 0 4px 0 rgba(74,42,18,.1); }
  h1 { margin: 0; font-size: clamp(26px, 6vw, 40px); line-height: 1.05; }
  .pick { margin-top: 12px; }
  .pick label { font-weight: 800; font-size: 15px; opacity: .75; display: block; margin: 0 4px 2px; }
  .row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .row::-webkit-scrollbar { display: none; }
  .row button { flex: none; scroll-snap-align: start; font: inherit; font-size: 16px; font-weight: 800; color: var(--ink); border: 3px solid #fff; background: rgba(255,255,255,.7); border-radius: 999px; padding: 4px 14px 4px 8px; cursor: pointer; min-height: 48px; }
  .row button .e { font-size: 24px; vertical-align: -3px; margin-right: 2px; }
  #ra button.on { background: var(--a); border-color: var(--a); }
  #rb button.on { background: var(--b); border-color: var(--b); }
  .duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 14px 0 6px; }
  .duel .who { text-align: center; }
  .duel .ph { position: relative; aspect-ratio: 1; border-radius: 28px; overflow: hidden; border: 5px solid var(--c); background: #fff; display: grid; place-items: center; font-size: clamp(56px, 16vw, 96px); box-shadow: 0 8px 0 rgba(74,42,18,.12); }
  .duel .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .duel .nm { font-weight: 800; font-size: clamp(18px, 4.6vw, 24px); line-height: 1.05; margin-top: 8px; }
  .duel .cr { font-size: 10px; opacity: .6; line-height: 1.2; margin-top: 2px; word-break: break-word; }
  .vs { font-weight: 800; font-size: 22px; background: #fff; border-radius: 50%; width: 52px; height: 52px; display: grid; place-items: center; border: 0; cursor: pointer; color: var(--ink); box-shadow: 0 4px 0 rgba(74,42,18,.12); font-family: inherit; }
  section { background: rgba(255,255,255,.8); border-radius: 26px; padding: 12px 16px 14px; margin-top: 12px; box-shadow: 0 6px 0 rgba(74,42,18,.08); }
  section h2 { margin: 0 0 6px; font-size: 21px; }
  .big { font-size: clamp(18px, 4.8vw, 22px); font-weight: 800; line-height: 1.25; margin: 4px 0 10px; }
  .size { display: grid; gap: 10px; }
  .size .l { display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; }
  .size .track { height: 26px; border-radius: 999px; background: #f3ead8; overflow: hidden; }
  .size .fill { height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.25,1.2,.5,1); display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 18px; }
  .size small { font-size: 14px; opacity: .75; }
  .vs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f0e6d4; }
  .vs-row:last-child { border-bottom: 0; }
  .vs-row > b { grid-column: 1 / -1; font-size: 16px; }
  .vs-row > div { font-size: 16px; line-height: 1.3; border-left: 5px solid var(--c); padding-left: 8px; }
  .tag { display: inline-block; background: #fff1c4; border-radius: 999px; padding: 0 8px; font-weight: 800; font-size: 14px; margin-bottom: 2px; }
  .ladder { list-style: none; margin: 0; padding: 0; }
  .ladder li { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0e6d4; font-size: 15px; line-height: 1.2; }
  .ladder li:last-child { border-bottom: 0; }
  .ladder li small { font-weight: 800; opacity: .6; }
  .ladder li.same { background: #e6f7d9; border-radius: 12px; }
  .ladder li.same span:first-of-type { grid-column: 2 / -1; text-align: center; font-weight: 800; }
  .ladder li.same span + span { display: none; }
  .go { display: block; text-align: center; margin-top: 14px; font-weight: 800; font-size: 18px; color: var(--ink); background: #ffd23f; border-radius: 999px; padding: 10px; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="bar"><a href="index.html" aria-label="Voltar ao catálogo">←</a><h1>⚖️ Comparar bichos</h1></div>
  <div class="pick"><label>Primeiro bicho</label><div class="row" id="ra" role="group" aria-label="Primeiro bicho"></div></div>
  <div class="pick"><label>Segundo bicho</label><div class="row" id="rb" role="group" aria-label="Segundo bicho"></div></div>
  <div class="duel">
    <div class="who" id="wa"></div>
    <button class="vs" id="troca" aria-label="Trocar de lado">VS</button>
    <div class="who" id="wb"></div>
  </div>
  <section aria-live="polite"><h2>📏 Quem é maior?</h2><div id="tam"></div></section>
  <section><h2>🧬 São parentes?</h2><div id="par"></div></section>
  <section><h2>🔍 Lado a lado</h2><div id="lado"></div></section>
  <div id="links"></div>
</main>
<script src="js/catalogo.js"></script>
<script src="js/dados.js"></script>
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const ok = (id) => ANIMAIS.some((a) => a.id === id);
  let a = ok(p.get('a')) ? p.get('a') : 'formiga';
  let b = ok(p.get('b')) && p.get('b') !== a ? p.get('b') : (a === 'onca' ? 'formiga' : 'onca');
  const get = (id) => ANIMAIS.find((x) => x.id === id);
  const art = (X, cap) => { const t = X.art || 'a'; return cap ? t.toUpperCase() : t; };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  function chips(boxId, lado) {
    const box = document.getElementById(boxId);
    ANIMAIS.forEach((x) => {
      const bt = document.createElement('button');
      bt.type = 'button'; bt.dataset.id = x.id;
      bt.innerHTML = '<span class="e">' + x.emoji + '</span>' + x.nome;
      bt.addEventListener('click', () => {
        if (lado === 'a') { if (x.id === b) b = a; a = x.id; } else { if (x.id === a) a = b; b = x.id; }
        render();
      });
      box.appendChild(bt);
    });
  }
  // números redondos e fáceis de ler para crianças
  function vezes(r) {
    if (r < 1.3) return null;
    if (r < 2) return 'um pouco maior';
    const n = r < 10 ? Math.round(r) : r < 100 ? Math.round(r / 5) * 5 : Math.round(r / Math.pow(10, Math.floor(Math.log10(r)) - 1)) * Math.pow(10, Math.floor(Math.log10(r)) - 1);
    return 'umas ' + n.toLocaleString('pt-BR') + ' vezes maior';
  }
  function quem(lado, A, cor) {
    const w = document.getElementById(lado);
    w.style.setProperty('--c', cor);
    w.innerHTML = '<div class="ph" style="--c:' + cor + '">' + A.emoji + '</div><div class="nm">' + A.nome + '</div><div class="cr"></div>';
    Dados.foto(A).then((f) => {
      if (w.dataset.id !== A.id) return;
      const img = new Image(); img.alt = 'Foto de ' + A.nome;
      img.onload = () => { w.querySelector('.ph').appendChild(img); w.querySelector('.cr').textContent = '📷 ' + f.autor; };
      img.src = f.mini || f.url;
    }).catch(() => {});
    w.dataset.id = A.id;
  }
  function render() {
    history.replaceState(null, '', '?a=' + a + '&b=' + b);
    document.querySelectorAll('#ra button').forEach((x) => x.classList.toggle('on', x.dataset.id === a));
    document.querySelectorAll('#rb button').forEach((x) => x.classList.toggle('on', x.dataset.id === b));
    const A = get(a), B = get(b), CA = A.comp, CB = B.comp;
    const css = getComputedStyle(document.documentElement);
    const ca = css.getPropertyValue('--a').trim(), cb = css.getPropertyValue('--b').trim();
    quem('wa', A, ca); quem('wb', B, cb);

    // tamanho: barras em escala logarítmica (de 1 mm a 3 m), senão a formiga some
    const pct = (mm) => 8 + 92 * Math.log(mm) / Math.log(3000);
    const [M, m] = CA.mm >= CB.mm ? [A, B] : [B, A];
    const fr = vezes(M.comp.mm / m.comp.mm);
    const barra = (X, cor) => '<div><div class="l"><span>' + X.emoji + ' ' + X.nome + '</span><span>' + X.comp.tam + '</span></div>' +
      '<div class="track"><div class="fill" style="width:' + pct(X.comp.mm) + '%;background:' + cor + '"></div></div><small>Do tamanho de ' + X.comp.igual + '.</small></div>';
    document.getElementById('tam').innerHTML = '<p class="big">' + (fr ? art(M, 1) + ' ' + M.nome + ' é ' + fr + ' que ' + art(m) + ' ' + m.nome + '!' : 'Os dois têm quase o mesmo tamanho!') + '</p>' +
      '<div class="size">' + barra(A, ca) + barra(B, cb) + '</div>';

    // parentesco: compara filo, classe, ordem e família
    let igual = -1;
    for (let i = 0; i < 4 && CA.tax[i] === CB.tax[i]; i++) igual = i;
    const nm = (t) => NOMES_TAX[t] || t;
    const frase = [
      'Parentes bem distantes: ' + (CA.tax[0] === 'Arthropoda' ? 'um tem o esqueleto por fora e o outro tem ossos por dentro.' : 'um tem ossos por dentro e o outro tem o esqueleto por fora.'),
      'Os dois são ' + nm(CA.tax[0]).split(' (')[0].toLowerCase() + ', mas de classes diferentes: são parentes distantes.',
      'Os dois são ' + nm(CA.tax[1]).toLowerCase() + '! Mas de ordens diferentes.',
      'Primos! São da mesma ordem (' + CA.tax[2] + '), mas de famílias diferentes.',
      'Parentes bem próximos: são da mesma família (' + CA.tax[3] + ')!'
    ][igual + 1];
    document.getElementById('par').innerHTML = '<p class="big">' + frase + '</p><ul class="ladder">' + NIVEIS_TAX.map((n, i) =>
      '<li class="' + (CA.tax[i] === CB.tax[i] ? 'same' : '') + '"><small>' + n + '</small><span>' + (CA.tax[i] === CB.tax[i] ? '✅ ' : '') + esc(nm(CA.tax[i])) + '</span><span>' + esc(nm(CB.tax[i])) + '</span></li>').join('') + '</ul>';

    // lado a lado
    const dieta = (C) => '<span class="tag">' + DIETAS[C.dieta][0] + ' ' + DIETAS[C.dieta][1] + '</span><br>' + C.come;
    const sit = (C) => C.iucn ? IUCN[C.iucn][0] + ' ' + IUCN[C.iucn][1] : '⚪ Não avaliada';
    const linhas = [
      ['🍽️ O que come', dieta],
      ['⏳ Quanto vive', (C) => C.vive],
      ['👨‍👩‍👧 Com quem vive', (C) => C.social],
      ['🏠 Onde mora', (C) => C.casa],
      ['🛡️ Situação na natureza', sit]
    ];
    document.getElementById('lado').innerHTML = linhas.map(([t, f]) =>
      '<div class="vs-row"><b>' + t + '</b><div style="--c:' + ca + '">' + f(CA) + '</div><div style="--c:' + cb + '">' + f(CB) + '</div></div>').join('') +
      (CA.dieta === CB.dieta ? '<p class="big">🍽️ Os dois comem do mesmo jeito: ' + DIETAS[CA.dieta][1].toLowerCase() + '!</p>' : '');

    document.getElementById('links').innerHTML = [A, B].filter((x) => x.pagina).map((x) => '<a class="go" href="' + x.pagina + '">▶ Ver ' + x.nome + ' em 3D</a>').join('');
  }
  chips('ra', 'a'); chips('rb', 'b');
  document.getElementById('troca').addEventListener('click', () => { [a, b] = [b, a]; render(); });
  render();
  // deixa os bichos escolhidos à vista nas faixas
  ['ra', 'rb'].forEach((r) => { const on = document.querySelector('#' + r + ' .on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' }); });
})();
</script>
<script src="js/app.js"></script>
</body>
</html>
