<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bio no Bolso">
<meta name="description" content="Biblioteca 3D do Bio no Bolso: plantas, rochas, ninhos, fungos e o micromundo para girar, aproximar e descobrir cada parte.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icone/favicon.png">
<link rel="apple-touch-icon" href="img/icone/apple-touch-icon.png">
<title>Biblioteca 3D · Bio no Bolso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/marca.css">
<link rel="stylesheet" href="css/biblioteca.css">
</head>
<body>
<header class="cabecalho">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Bio no Bolso: voltar ao início"><img class="logo-img" src="img/marca/bnb-horizontal-144.png" srcset="img/marca/bnb-horizontal-72.png 1x, img/marca/bnb-horizontal-144.png 2x" width="216" height="72" alt="Bio no Bolso"></a>
    <a class="bib-voltar" href="index.html">← Início</a>
  </div>
</header>

<main class="bib">
  <section class="wrap bib-topo">
    <h1>Biblioteca 3D</h1>
    <p>Gire, aproxime e toque em cada parte para descobrir o que é. Plantas, pedras, ninhos, fungos e coisas tão pequenas que só se veem no microscópio.</p>
    <div class="chips" id="filtros" role="tablist" aria-label="Categorias"></div>
  </section>
  <section class="wrap">
    <ul class="bib-grade" id="grade"></ul>
    <p class="bib-nota">Modelos didáticos: simplificam a natureza para ficar fácil de entender. Textos em revisão científica.</p>
  </section>
</main>

<!-- visor -->
<section class="visor3d" id="visor" hidden aria-label="Visor 3D">
  <canvas id="tela3d" aria-label="Modelo 3D: arraste para girar, use dois dedos para aproximar e toque numa parte"></canvas>
  <header class="v-topo">
    <button type="button" class="v-bola" id="v-voltar" aria-label="Voltar para a biblioteca">←</button>
    <div class="v-titulo"><small id="v-cat"></small><b id="v-nome"></b></div>
    <div class="v-idade" role="radiogroup" aria-label="Quanto texto mostrar">
      <button type="button" data-idade="pequeno" role="radio">🧸</button><button type="button" data-idade="explorador" role="radio">🧒</button>
    </div>
  </header>
  <p class="v-aviso" id="v-escala" hidden></p>
  <div class="v-lado" id="v-acoes"></div>
  <div class="v-base">
    <div class="v-cartao" id="v-cartao" aria-live="polite"></div>
    <div class="v-partes" id="v-partes" role="list"></div>
  </div>
</section>

<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/OrbitControls.js"></script>
<script src="vendor/three/RoomEnvironment.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/biblioteca/visor.js"></script>
<script src="js/biblioteca/plantas.js"></script>
<script src="js/biblioteca/rochas.js"></script>
<script src="js/biblioteca/ninhos.js"></script>
<script src="js/biblioteca/micro.js"></script>
<script src="js/biblioteca/pagina.js"></script>
</body>
</html>
