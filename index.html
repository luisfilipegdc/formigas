<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saúva 3D</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 40%, #fffaf0 0%, #f3e3c3 60%, #e2c99a 100%);
    font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #reset {
    position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 84px; height: 84px; border-radius: 50%; border: 5px solid #fff;
    background: #ffd23f; font-size: 42px; line-height: 1; color: #4a2a12;
    box-shadow: 0 6px 0 rgba(74,42,18,.18), 0 10px 20px rgba(74,42,18,.18);
    touch-action: manipulation; cursor: pointer;
  }
  #reset:active { transform: scale(.92); }
  #hint {
    position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(255,255,255,.85); color: #4a2a12; border-radius: 999px;
    padding: 10px 26px; font-size: 22px; font-weight: 700; white-space: nowrap;
    transition: opacity .8s; pointer-events: none;
  }
  #fail { position: fixed; inset: 0; display: none; place-items: center; text-align: center; font-size: 26px; color: #4a2a12; padding: 30px; }
</style>
</head>
<body>
<button id="reset" aria-label="Voltar a posição inicial">⟲</button>
<div id="hint">☝️ arraste para girar · 🤏 pinça para zoom</div>
<div id="fail">🐜<br>Precisa de internet para carregar o 3D.<br>Toque para tentar de novo.</div>

<!-- Three.js r147: scripts clássicos (funcionam até em iPads antigos) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
'use strict';

if (!window.THREE || !THREE.OrbitControls) {
  const f = document.getElementById('fail');
  f.style.display = 'grid';
  f.onclick = () => location.reload();
  return;
}

/* ================= CORES (edite à vontade) ================= */
const COR = {
  corpo: '#82260a',      // vermelho-ferrugem da saúva
  pernas: '#94351a',
  mandibulas: '#3a1205',
  olhos: '#111111'
};

// cores em hexadecimal interpretadas como sRGB (cores fiéis)
if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;

const V3 = THREE.Vector3, UP = new V3(0, 1, 0);

/* ================= RENDERIZADOR E CENA ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6b4a2a, 0.35));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(6, 14, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.radius = 6;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ================= MATERIAIS ================= */
// textura de "poros" bem fina para a carapaça não parecer plástico
function noiseTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 110 + Math.random() * 90;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  return t;
}
const bump = noiseTexture();
const mBody = new THREE.MeshPhysicalMaterial({
  color: COR.corpo, roughness: 0.45, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.3,
  bumpMap: bump, bumpScale: 0.015, envMapIntensity: 0.7
});
const mLeg = new THREE.MeshPhysicalMaterial({
  color: COR.pernas, roughness: 0.5, clearcoat: 0.4, clearcoatRoughness: 0.4, bumpMap: bump, bumpScale: 0.01, envMapIntensity: 0.7
});
const mJaw = new THREE.MeshPhysicalMaterial({ color: COR.mandibulas, roughness: 0.45, clearcoat: 0.3, envMapIntensity: 0.5 });
const mEye = new THREE.MeshPhysicalMaterial({ color: COR.olhos, roughness: 0.05, clearcoat: 1 });

/* ================= PEÇAS ================= */
function shadowy(m) { m.castShadow = true; m.receiveShadow = true; return m; }

// elipsoide liso, com deformação opcional dos vértices
function blob(l, h, w, pos, deform, segs) {
  const geo = new THREE.SphereGeometry(1, segs || 48, segs ? segs * 0.75 : 36);
  const p = geo.attributes.position, v = new V3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    if (deform) deform(v);
    p.setXYZ(i, v.x * l / 2, v.y * h / 2, v.z * w / 2);
  }
  geo.computeVertexNormals();
  const m = shadowy(new THREE.Mesh(geo, mBody));
  m.position.copy(pos);
  return m;
}

// segmento afunilado (perna/antena) de a até b: mais grosso no meio
function seg(parent, a, b, r0, r1, mat, bulge) {
  const len = a.distanceTo(b);
  const pts = [new THREE.Vector2(0, 0)];
  const N = 8;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const r = (r0 + (r1 - r0) * t) * (1 + (bulge || 0.25) * Math.sin(Math.PI * t));
    pts.push(new THREE.Vector2(r, t * len));
  }
  pts.push(new THREE.Vector2(0, len));
  const m = shadowy(new THREE.Mesh(new THREE.LatheGeometry(pts, 12), mat));
  m.position.copy(a);
  m.quaternion.setFromUnitVectors(UP, new V3().subVectors(b, a).normalize());
  parent.add(m);
  const j = shadowy(new THREE.Mesh(new THREE.SphereGeometry(r1 * 1.08, 12, 8), mat));
  j.position.copy(b);
  parent.add(j);
}

function spine(parent, base, dir, len, r) {
  const m = shadowy(new THREE.Mesh(new THREE.ConeGeometry(r, len, 10), mBody));
  m.position.copy(base).addScaledVector(dir, len / 2);
  m.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  parent.add(m);
}

/* ================= A SAÚVA =================
   X = frente, Y = cima, Z = lados. Unidades ≈ milímetros. */
const ant = new THREE.Group();
scene.add(ant);

// ---- CABEÇA: grande, em forma de coração (dois lobos atrás) ----
const H = { x: 3.3, y: 2.75, l: 3.2, h: 2.7, w: 3.9 };
const head = blob(H.l, H.h, H.w, new V3(H.x, H.y, 0), (v) => {
  if (v.x < 0) v.x += 0.42 * Math.exp(-(v.z * v.z) / 0.05) * -v.x;   // sulco entre os lobos
  if (v.x > 0) v.x *= 0.88;                                          // rosto achatado
  if (v.y > 0) v.y *= 0.9;                                           // topo mais plano
});
head.rotation.z = -0.12;
ant.add(head);
// espinhos nos lobos da cabeça
for (const s of [-1, 1]) {
  spine(ant, new V3(H.x - H.l * 0.36, H.y + H.h * 0.28, s * H.w * 0.3), new V3(-0.7, 0.6, s * 0.35), 0.55, 0.13);
  // olhos (pequenos, nas laterais)
  const eye = shadowy(new THREE.Mesh(new THREE.SphereGeometry(0.26, 20, 14), mEye));
  eye.scale.set(1, 1, 0.7);
  eye.position.set(H.x + H.l * 0.12, H.y + H.h * 0.08, s * H.w * 0.46);
  ant.add(eye);
}

// ---- MANDÍBULAS: lâminas curvas com dentes ----
function mandible(s) {
  const sh = new THREE.Shape();
  sh.moveTo(0, 0);
  sh.bezierCurveTo(0.75, -0.2, 1.35, 0.25, 1.3, 1.1);    // borda de fora, curvando para dentro
  const teeth = [[1.1, 0.98], [1.08, 0.85], [0.94, 0.88], [0.9, 0.74], [0.76, 0.78], [0.7, 0.64], [0.55, 0.68], [0.48, 0.56], [0.3, 0.6]];
  teeth.forEach(([x, y]) => sh.lineTo(x, y));
  sh.lineTo(0.05, 0.55);
  sh.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.22, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 2, curveSegments: 10 });
  geo.translate(0, 0, -0.11);
  const m = shadowy(new THREE.Mesh(geo, mJaw));
  m.rotation.x = -Math.PI / 2;           // deita a lâmina na horizontal
  m.scale.y = s;                          // espelha para o outro lado
  const g = new THREE.Group();
  g.add(m);
  g.position.set(H.x + H.l * 0.36, H.y - H.h * 0.24, s * H.w * 0.28);
  g.rotation.set(0, 0, -0.18);
  ant.add(g);
}
mandible(1); mandible(-1);

// ---- TÓRAX (mesossoma) com 3 pares de espinhos ----
const T = { y: 2.35 };
ant.add(blob(1.7, 1.45, 1.55, new V3(1.05, T.y + 0.35, 0)));            // pronoto (ombro)
ant.add(blob(3.4, 1.15, 1.15, new V3(0.15, T.y, 0), (v) => { v.y += 0.12 * v.x; }));
ant.add(blob(1.2, 1.0, 1.05, new V3(-1.35, T.y - 0.05, 0)));            // propódeo
const neck = new THREE.Group(); ant.add(neck);
seg(neck, new V3(1.6, T.y + 0.35, 0), new V3(H.x - H.l * 0.4, H.y - 0.15, 0), 0.42, 0.42, mBody, 0);
for (const s of [-1, 1]) {
  spine(ant, new V3(1.35, T.y + 0.55, s * 0.6), new V3(0.2, 0.55, s * 0.8), 0.55, 0.12);   // pronotais
  spine(ant, new V3(0.4, T.y + 0.5, s * 0.3), new V3(-0.1, 1, s * 0.35), 0.45, 0.1);       // mesonotais
  spine(ant, new V3(-1.45, T.y + 0.35, s * 0.3), new V3(-0.6, 0.8, s * 0.35), 0.75, 0.12); // propodeais
}

// ---- PECÍOLO (cintura fina, 2 nós) ----
const waist = new THREE.Group(); ant.add(waist);
seg(waist, new V3(-1.8, T.y - 0.1, 0), new V3(-2.25, T.y + 0.05, 0), 0.22, 0.2, mBody, 0);
ant.add(blob(0.55, 0.75, 0.6, new V3(-2.35, T.y + 0.2, 0)));
seg(waist, new V3(-2.5, T.y + 0.05, 0), new V3(-2.75, T.y + 0.1, 0), 0.22, 0.22, mBody, 0);
ant.add(blob(0.7, 0.75, 0.9, new V3(-2.95, T.y + 0.2, 0)));

// ---- ABDÔMEN (gáster) ----
const gaster = blob(3.1, 2.3, 2.6, new V3(-4.55, T.y + 0.35, 0), (v) => { if (v.x > 0) v.x *= 0.9; });
gaster.rotation.z = 0.18;
ant.add(gaster);

// ---- 6 PERNAS articuladas, presas ao tórax ----
const legs = new THREE.Group(); ant.add(legs);
const LEG = [
  { x: 1.05, ang: 35, f: 3.2, t: 3.0, ta: 2.3 },   // dianteiras
  { x: 0.05, ang: 95, f: 3.4, t: 3.2, ta: 2.4 },   // do meio
  { x: -1.0, ang: 145, f: 3.8, t: 3.6, ta: 2.7 }   // traseiras (mais longas)
];
for (const s of [-1, 1]) for (const L of LEG) {
  const a = L.ang * Math.PI / 180;
  const dir = new V3(Math.cos(a), 0, s * Math.sin(a));
  const hip = new V3(L.x, T.y - 0.45, s * 0.45);
  const coxaEnd = hip.clone().addScaledVector(dir, 0.55); coxaEnd.y -= 0.35;
  const knee = coxaEnd.clone().addScaledVector(dir, L.f * 0.85); knee.y = coxaEnd.y + L.f * 0.48;
  const ankle = knee.clone().addScaledVector(dir, L.t * 0.7); ankle.y = 0.5;
  seg(legs, hip, coxaEnd, 0.3, 0.24, mLeg, 0.1);          // coxa
  seg(legs, coxaEnd, knee, 0.2, 0.16, mLeg, 0.35);        // fêmur
  seg(legs, knee, ankle, 0.15, 0.11, mLeg, 0.2);          // tíbia
  // tarso em 3 gominhos encostando no chão
  let p = ankle;
  for (let k = 1; k <= 3; k++) {
    const q = ankle.clone().addScaledVector(dir, L.ta * k / 3);
    q.y = 0.5 * (1 - k / 3) + 0.08;
    seg(legs, p, q, 0.11 - k * 0.01, 0.1 - k * 0.01, mLeg, 0.12);
    p = q;
  }
}

// ---- 2 ANTENAS cotoveladas (escapo + 10 gominhos) ----
const antennae = [];
for (const s of [-1, 1]) {
  const g = new THREE.Group();
  g.position.set(H.x + H.l * 0.3, H.y + H.h * 0.15, s * H.w * 0.18);
  const elbow = new V3(-0.5, 1.55, s * 1.85);
  seg(g, new V3(), elbow, 0.12, 0.13, mLeg, 0.1);                       // escapo
  let p = elbow;
  for (let k = 1; k <= 10; k++) {                                         // funículo
    const t = k / 10;
    const q = elbow.clone().add(new V3(3.0 * t, 0.5 * Math.sin(Math.PI * t) - 0.6 * t * t, s * 0.9 * t));
    const r = 0.1 + 0.07 * t;
    seg(g, p, q, r * 0.92, r, mLeg, 0.1);
    p = q;
  }
  ant.add(g);
  antennae.push(g);
}

/* ================= CÂMERA E TOQUE ================= */
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 200);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.8;
controls.screenSpacePanning = true;
controls.maxPolarAngle = Math.PI * 0.55;
controls.minDistance = 6;
controls.maxDistance = 60;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

const box = new THREE.Box3().setFromObject(ant);
const center = box.getCenter(new V3());
const radius = box.getSize(new V3()).length() / 2;

function home() {
  const vfov = camera.fov * Math.PI / 180;
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const d = radius / Math.sin(Math.min(vfov, hfov) / 2) * 0.82;
  controls.target.copy(center);
  camera.position.copy(center).add(new V3(0.85, 0.55, 1.1).normalize().multiplyScalar(d));
  controls.update();
}
home();

const hint = document.getElementById('hint');
controls.addEventListener('start', () => {
  controls.autoRotate = false;   // parou de girar sozinha: agora é com você
  hint.style.opacity = 0;
});
setTimeout(() => { hint.style.opacity = 0; }, 6000);
document.getElementById('reset').addEventListener('click', () => { home(); });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
document.addEventListener('gesturestart', (e) => e.preventDefault());

/* ================= ANIMAÇÃO ================= */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  antennae.forEach((g, i) => {             // anteninhas mexendo devagar
    g.rotation.y = Math.sin(t * 1.8 + i * 1.9) * 0.1;
    g.rotation.z = Math.sin(t * 1.3 + i) * 0.07;
  });
  controls.update();
  renderer.render(scene, camera);
});
})();
</script>
</body>
</html>
